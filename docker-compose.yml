# Запуск: docker compose up --build
# API:       http://localhost:8000/docs (доступен только с этого компьютера)
# Интерфейс: http://localhost:8501
# База — SQLite-файл data/ilfa.db, его строит скрипт etl/ (см. etl/README.md).
services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////app/data/ilfa.db
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"  # API снаружи закрыт, к нему ходит только интерфейс

  ui:
    build: .
    command: streamlit run app/ui/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      - "8501:8501"
    depends_on:
      - api

  # Построить базу из data/raw/anonymized: docker compose run --rm etl
  etl:
    build: .
    command: python -m etl.load data/raw/anonymized
    environment:
      DATABASE_URL: sqlite:////app/data/ilfa.db
    volumes:
      - ./data:/app/data
    profiles: ["tools"]
